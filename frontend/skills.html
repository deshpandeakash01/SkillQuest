<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Marketplace - SkillQuest</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/skills.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="logo">SkillQuest</a>
    <div class="nav-links">
      <a href="skills.html" class="active">Marketplace</a>
      <a href="live.html">Live Classes</a>
      <a href="portfolio.html">My Portfolio</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- Header -->
    <div class="mb-6">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h1>Explore Skills</h1>
          <p style="color: var(--text-muted);">Discover, Learn, and Teach.</p>
        </div>
        <div class="card" style="padding: 10px 20px;">
          <span style="font-size: 0.9rem; color: var(--text-muted);">Your Credits:</span>
          <span id="creditDisplay" style="font-weight: bold; color: var(--secondary);">Loading...</span>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="card p-4">
        <input type="text" id="searchInput" placeholder="🔍 Search by Skill, Tutor, or Outcome..."
          style="width: 100%; padding: 12px; background: #262626; border: 1px solid #444; border-radius: 8px; color: white; font-size: 1rem; margin-bottom: 12px;">

        <div class="flex gap-2" style="overflow-x: auto; padding-bottom: 4px;" id="categoryFilters">
          <button class="btn btn-sm btn-primary" data-cat="All">All</button>
          <button class="btn btn-sm btn-secondary" data-cat="Technical">Technical</button>
          <button class="btn btn-sm btn-secondary" data-cat="Communication">Communication</button>
          <button class="btn btn-sm btn-secondary" data-cat="Art">Art</button>
          <button class="btn btn-sm btn-secondary" data-cat="Music">Music</button>
          <button class="btn btn-sm btn-secondary" data-cat="Business">Business</button>
          <button class="btn btn-sm btn-secondary" data-cat="Language">Language</button>
          <button class="btn btn-sm btn-secondary" data-cat="Health">Health</button>
          <button class="btn btn-sm btn-secondary" data-cat="General">General</button>
        </div>
      </div>
    </div>

    <!-- Skills Grid -->
    <div id="skillsContainer" class="grid grid-cols-3">
      <!-- Dynamic Content -->
      <p style="color: var(--text-muted);">Loading skills...</p>
    </div>
  </div>

  <!-- Rate Teacher Modal -->
  <div id="rateModal"
    style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center;">
    <div class="card" style="width: 300px; text-align: center;">
      <h2>Rate Teacher</h2>
      <p class="mb-4">How was the class?</p>
      <div class="flex justify-between mb-4" style="font-size: 1.5rem; cursor: pointer;">
        <span onclick="setRating(1)">★</span>
        <span onclick="setRating(2)">★</span>
        <span onclick="setRating(3)">★</span>
        <span onclick="setRating(4)">★</span>
        <span onclick="setRating(5)">★</span>
      </div>
      <input type="hidden" id="ratingValue" value="5">
      <input type="hidden" id="ratingTeacherId" value="">
      <button onclick="submitRating()" class="btn btn-primary" style="width: 100%;">Submit Rating</button>
      <button onclick="closeModal()" class="btn btn-secondary mt-4" style="width: 100%;">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/skills.js"></script>
</body>

</html>
