<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - SkillQuest</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .create-container {
            max-width: 800px;
            margin: 2rem auto;
        }

        .q-block {
            background: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ff6b00;
        }

        body.light .q-block {
            background: white;
        }

        .opt-row {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
            align-items: center;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .success-box {
            padding: 20px;
            background: #28a745;
            color: white;
            text-align: center;
            border-radius: 8px;
            display: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
        }

        body.light input[type="text"] {
            background: #fff;
            color: #333;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">SkillQuest</a>
        <div class="nav-links">
            <a href="live.html">Back to Class</a>
        </div>
    </nav>

    <div class="container create-container">
        <h1>Create a New Quiz</h1>

        <div id="successBox" class="success-box">
            <h2>Quiz Created!</h2>
            <p>Share this link with your students:</p>
            <input type="text" id="shareLink" readonly style="color: black;">
        </div>

        <div id="createFormArea">
            <input type="text" id="quizTitle" placeholder="Quiz Title (e.g. React Basics)"
                style="font-size: 1.2rem; font-weight: bold;">

            <div id="questionsList"></div>

            <button onclick="addQuestion()" class="btn btn-secondary">+ Add Question</button>
            <br><br>
            <button onclick="publishQuiz()" class="btn btn-primary" style="width: 100%;">Publish Quiz</button>
        </div>
    </div>

    <script src="js/quiz_create.js"></script>
</body>

</html>
